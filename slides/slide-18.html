<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS100 — IPC Expansion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,sans-serif}.scene{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;background:#050810;color:#fff;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(3,7,13,.98) 0%,rgba(3,7,13,.88) 29%,rgba(3,7,13,.42) 49%,rgba(3,7,13,.05) 72%),linear-gradient(0deg,rgba(3,7,13,.68),transparent 38%);pointer-events:none}.scene:after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 72% 48%,transparent 25%,rgba(0,0,0,.58) 100%),repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.035) 3px 4px);pointer-events:none}.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#000;opacity:0;transform:scale(1.025);transition:opacity 1s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}.scene.ready .video{opacity:1;transform:scale(1)}.copy{position:absolute;left:112px;top:204px;width:850px;z-index:5}.eyebrow{font-size:16px;font-weight:700;letter-spacing:.36em;color:#2af598;margin-bottom:30px;opacity:0;transform:translateY(18px);transition:.75s ease .2s}.headline{font-size:76px;font-weight:900;line-height:1.08;letter-spacing:-.048em;max-width:820px;opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .9s ease .35s,transform 1.05s cubic-bezier(.16,1,.3,1) .35s,filter .9s ease .35s}.headline span{display:block;background:linear-gradient(135deg,#2af598,#009efd);-webkit-background-clip:text;background-clip:text;color:transparent}.rule{width:0;height:3px;margin:34px 0 28px;background:linear-gradient(90deg,#2af598,#009efd);box-shadow:0 0 18px rgba(42,245,152,.35);transition:width .8s cubic-bezier(.16,1,.3,1) 1s}.tagline{font-size:30px;font-weight:500;color:rgba(215,226,238,.78);letter-spacing:-.025em;opacity:0;transform:translateY(16px);transition:.75s ease 1.15s}.scene.ready .eyebrow,.scene.ready .headline,.scene.ready .tagline{opacity:1;transform:none;filter:none}.scene.ready .rule{width:94px}.corner{position:absolute;right:64px;top:55px;z-index:6;font-size:13px;font-weight:600;letter-spacing:.25em;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="scene" id="scene">
  <video id="installVideo" class="video" src="../assets/DS100-IPC.mp4" autoplay muted playsinline preload="auto"></video>
  <div class="copy">
    <div class="eyebrow">IPC EXPANSION</div>
    <h1 class="headline">Add one more IPC camera.<span>See one more critical angle.</span></h1>
    <div class="rule"></div>
    <p class="tagline">Expansion, without complication.</p>
  </div>
  <div class="corner">DS100 · IPC</div>
</div>
<script>
const scene=document.getElementById('scene'),video=document.getElementById('installVideo');function scale(){scene.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}addEventListener('resize',scale);scale();video.muted=true;video.play().catch(()=>{});video.addEventListener('ended',()=>{video.pause();if(Number.isFinite(video.duration))video.currentTime=Math.max(0,video.duration-.04)});requestAnimationFrame(()=>setTimeout(()=>scene.classList.add('ready'),100));
</script>
</body>
</html>
