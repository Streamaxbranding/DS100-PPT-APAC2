<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel — Coming Soon</title>
<style>
:root{--g:#9bc321;--b:#009efd;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.slide{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:radial-gradient(circle at 68% 45%,rgba(155,195,33,.11),transparent 28%),#020403}.scan{position:absolute;left:-20%;right:-20%;top:-30%;height:3px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 48px rgba(155,195,33,.45);opacity:.6;animation:scan 4.8s ease-in-out .5s infinite}.copy{position:absolute;z-index:3;left:120px;top:145px;right:120px}.eyebrow{font-size:15px;letter-spacing:.38em;text-transform:uppercase;color:var(--g);font-weight:800;opacity:0;animation:up .7s var(--ease) .1s forwards}.question{font-size:72px;line-height:1.05;letter-spacing:-.045em;color:#b9c2ce;margin-top:54px;opacity:0;animation:up .8s var(--ease) .28s forwards}.name{font-size:190px;line-height:.92;letter-spacing:-.065em;font-weight:880;margin-top:36px;opacity:0;animation:up .9s var(--ease) .48s forwards}.name span{background:linear-gradient(90deg,#d7ff51,var(--g));-webkit-background-clip:text;color:transparent}.promise{font-size:30px;color:#99a5b5;margin-top:42px;opacity:0;animation:up .8s var(--ease) .7s forwards}.coming{position:absolute;z-index:4;right:120px;bottom:92px;font-size:14px;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:800;opacity:0;animation:up .7s var(--ease) .95s forwards}.mark{position:absolute;right:135px;top:135px;width:230px;height:230px;border:1px solid rgba(155,195,33,.26);border-radius:50%;box-shadow:0 0 80px rgba(155,195,33,.1),inset 0 0 60px rgba(155,195,33,.05);opacity:0;animation:mark 1.1s var(--ease) .65s forwards}.mark:after{content:"S";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:102px;font-weight:850;color:rgba(215,255,81,.85)}.brand{position:absolute;left:32px;bottom:22px;height:23px;opacity:.52}@keyframes up{from{opacity:0;transform:translateY(26px);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes mark{to{opacity:1;transform:rotate(360deg)}}@keyframes scan{0%{top:-10%;opacity:0}20%{opacity:.6}80%{opacity:.6}100%{top:110%;opacity:0}}
</style></head><body><main class="slide" id="slide-container"><div class="scan"></div><div class="mark" aria-hidden="true"></div><section class="copy"><div class="eyebrow">A New Line of Defense</div><h1 class="question">Fuel loss shouldn’t stay invisible.</h1><div class="name">Meet <span>Sentinel.</span></div><p class="promise">Protect every tank. See what used to go unseen.</p></section><div class="coming">Coming Soon</div><img class="brand" src="../assets/Branding__streamax.png" alt="Streamax"></main><script>function fit(){const e=document.getElementById('slide-container'),s=Math.min(innerWidth/1920,innerHeight/1080);e.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();</script><!-- [Sources] Product positioning only; no technical Sentinel specifications asserted. --></body></html>
