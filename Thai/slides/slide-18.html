<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS100 — การขยาย IPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,sans-serif}.scene{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;background:#050810;color:#fff;overflow:hidden}.scene:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,rgba(3,7,13,.98) 0%,rgba(3,7,13,.88) 29%,rgba(3,7,13,.42) 49%,rgba(3,7,13,.05) 72%),linear-gradient(0deg,rgba(3,7,13,.68),transparent 38%);pointer-events:none;opacity:0;transition:opacity .9s cubic-bezier(.16,1,.3,1)}.scene:after{content:"";position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 72% 48%,transparent 25%,rgba(0,0,0,.58) 100%),repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.035) 3px 4px);pointer-events:none;opacity:0;transition:opacity .9s cubic-bezier(.16,1,.3,1)}.scene.copy-visible:before,.scene.copy-visible:after{opacity:1}.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;background:#000;opacity:0;transform:scale(1.025);transition:opacity 1s ease,transform 1.8s cubic-bezier(.16,1,.3,1)}.scene.ready .video{opacity:1;transform:scale(1)}.copy{position:absolute;left:112px;top:204px;width:850px;z-index:5}.eyebrow{font-size:16px;font-weight:700;letter-spacing:.36em;color:#2af598;margin-bottom:30px;opacity:0;transform:translateY(18px);transition:.75s ease .1s}.headline{font-size:76px;font-weight:900;line-height:1.08;letter-spacing:-.048em;max-width:820px;opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .9s ease .22s,transform 1.05s cubic-bezier(.16,1,.3,1) .22s,filter .9s ease .22s}.headline span{display:block;background:linear-gradient(135deg,#2af598,#009efd);-webkit-background-clip:text;background-clip:text;color:transparent}.rule{width:0;height:3px;margin:34px 0 28px;background:linear-gradient(90deg,#2af598,#009efd);box-shadow:0 0 18px rgba(42,245,152,.35);transition:width .8s cubic-bezier(.16,1,.3,1) .78s}.tagline{font-size:30px;font-weight:500;color:rgba(215,226,238,.78);letter-spacing:-.025em;opacity:0;transform:translateY(16px);transition:.75s ease .9s}.scene.copy-visible .eyebrow,.scene.copy-visible .headline,.scene.copy-visible .tagline{opacity:1;transform:none;filter:none}.scene.copy-visible .rule{width:94px}.corner{position:absolute;right:64px;top:55px;z-index:6;font-size:13px;font-weight:600;letter-spacing:.25em;color:rgba(255,255,255,.3);opacity:0;transition:opacity .75s ease .3s}.scene.copy-visible .corner{opacity:1}
</style>
<link rel="stylesheet" href="shared-typography.css?v=20260814-r3">
<link rel="stylesheet" href="thai-typography.css?v=20260816-r1">
</head>
<body class="ds-group-b">
<div class="scene" id="scene">
  <video id="installVideo" class="video" src="../assets/DS100-IPC2.mov" autoplay muted playsinline preload="auto"></video>
  <div class="copy">
    <div class="eyebrow">การขยาย IPC</div>
    <h1 class="headline">ขยายระบบ <span>โดยไม่ยุ่งยาก</span></h1>
    <div class="rule"></div>
    <p class="tagline">เพิ่มกล้องอีกหนึ่งตัว เพื่อครอบคลุมมุมสำคัญของคุณ</p>
  </div>
  <div class="corner">DS100 · IPC</div>
</div>
<script>
const scene=document.getElementById('scene'),video=document.getElementById('installVideo');function scale(){scene.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}function revealCopy(){scene.classList.add('copy-visible')}addEventListener('resize',scale);scale();video.muted=true;video.play().catch(()=>{});video.addEventListener('ended',()=>{video.pause();if(Number.isFinite(video.duration))video.currentTime=Math.max(0,video.duration-.04);revealCopy()});requestAnimationFrame(()=>setTimeout(()=>scene.classList.add('ready'),100));
</script>
<script src="shared-compliance-footer.js"></script></body>
</html>
